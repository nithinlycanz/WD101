<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Car Brands</h2>
    <ul id="cars"></ul>
    <script>
        let cars = ["Toyota", "Honda", "Ford", "Chevrolet", "Nissan", "BMW", "Mercedes", "Audi", "Volkswagen", "Hyundai"];
        let results = [];

        let lolcreatelist = (value) => {
            let element = "<li>"+value+"</li>";
            results.push(element);
        };
        cars.forEach(lolcreatelist);
        document.getElementById("cars").innerHTML = results.join("\n");
    </script>
</body>
</html>
